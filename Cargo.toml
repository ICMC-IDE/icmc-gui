[package]
name = "icmc-gui"
version = "0.2.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.36.1"
egui_extras = { version = "0.36.1", default-features = false, features = ["serde"] }
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow", # rendering backend (alternative: wgpu)
    "x11", # enable X11 support (alternative: wayland)
    "persistence", # remember native window size/position across launches
] }
egui_dock = { version = "0.21.1", features = ["serde"] }
bytemuck = "1.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9.5"
web-time = "1.1.0"
gloo-timers = { version="0.3.0", features = ["futures"] }
egui_code_editor = { version = "0.3.8", default-features = false, features = ["editor", "egui"] }
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.70", features = ["Window", "Document", "HtmlElement", "Text"] }
rfd = "0.14"
egui_material_icons = "0.8"

icmc-emulator = { git = "https://github.com/ICMC-IDE/icmc-emulator.git", branch = "dev" }
assembler = { git = "https://github.com/ICMC-IDE/assembler.git", branch = "dev" }
mif = { git = "https://github.com/ICMC-IDE/mif.git" }
tokio = { version = "1.49.0", features = ["time"] }

# native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6.0.0"
env_logger = "0.11"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
trash = "5"
opener = { version = "0.8", features = ["reveal"] }

# web
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3.70" # for accessing DOM
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 2 # fast and minimal wasm

[profile.dev.package."*"]
opt-level = 2
